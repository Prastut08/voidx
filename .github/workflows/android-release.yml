name: CycloneX Android Release & Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release CycloneX Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile
        run: |
          touch .env
          flutter pub get

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=ENVIRONMENT=prod

      - name: Build Android App Bundle (AAB)
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release --dart-define=ENVIRONMENT=prod

      - name: Verify Output Artifacts
        run: |
          ls -lh apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          ls -lh apps/mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonex-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonex-android-bundle
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CycloneX Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          body: |
            ## CycloneX Android Release ${{ github.ref_name }}
            
            **CycloneX** is an intelligent cyclone monitoring and emergency rescue coordination platform engineered for real-time situational awareness, multi-agency dispatch, and life-critical response in disaster zones.
            
            ### 📱 Download & Install
            - **Direct APK Download**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk)
            - **Google Play App Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.aab)
            
            #### Android Installation Instructions:
            1. Download `app-release.apk` to your Android device.
            2. Open the downloaded file.
            3. If prompted, enable **"Install unknown apps"** in your Android device settings.
            4. Follow the system installer prompt to complete installation.
            5. Grant **Location** and **SMS / Notification** permissions when prompted to enable real-time emergency dispatch and offline relaying.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
