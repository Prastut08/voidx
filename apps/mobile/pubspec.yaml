name: cyclonex
description: "CycloneX — Intelligent Cyclone Monitoring and Emergency Rescue Coordination"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_config:
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  intl_phone_field:
  url_launcher:
  shared_preferences:
  geolocator:
  custom_sliding_segmented_control:
  internet_connection_checker: ^0.0.1
  material_segmented_control:
  modal_bottom_sheet:
  flutter_svg:
  http:
  flutter_local_notifications:
  timezone:
  web_socket_channel: ^2.4.5
  uuid: ^4.4.0


dependency_overrides:
  web: 0.5.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: "^0.13.1"


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/icon/
    - assets/background/
    - assets/maps/
    - assets/maps/markers/
    - assets/weatherData.json

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  adaptive_icon_background: "#ffffff" 
  adaptive_icon_foreground: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
