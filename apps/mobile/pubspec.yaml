name: cyclonex
description: CycloneX — Intelligent Cyclone Monitoring & Emergency Response
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path: ^1.9.0

  # UI
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # Connectivity
  connectivity_plus: ^5.0.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/icon.png"
