<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Sahaya</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }
    #windy-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: auto !important;
    }
    #windy-bg iframe {
      width: 100%; height: 100%; border: none;
      pointer-events: auto !important;
    }
    #flutter-hitzones {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999999;
    }
    .flutter-btn-target {
      pointer-events: auto !important;
      cursor: pointer !important;
      background: transparent !important;
      -webkit-tap-highlight-color: transparent;
    }
    /* Flutter canvas sits on top, fully transparent background */
    flt-glass-pane, flt-scene-host, flt-scene,
    flt-glass-pane canvas, flt-scene canvas, flt-scene-host canvas {
      background: transparent !important;
      background-color: transparent !important;
    }
    canvas {
      background: transparent !important;
      background-color: transparent !important;
    }
  </style>

  <script>
    // Allow Flutter to update Windy location via JS interop
    function updateWindyLocation(lat, lng) {
      var url = 'https://embed.windy.com/embed2.html?lat=' + lat +
        '&lon=' + lng + '&detailLat=' + lat + '&detailLon=' + lng +
        '&zoom=8&level=surface&overlay=wind&product=ecmwf' +
        '&menu=false&message=false&marker=false&calendar=now&pressure=false' +
        '&metricWind=default&metricTemp=default&radarRange=-1&key=OjwfppPns1vyuKYfXsKSdjiURjbPzdeT';
      var frame = document.getElementById('windy-frame');
      if (frame) {
        frame.src = url;
      }
    }

    var flutterInteractive = false;
    function setFlutterInteractive(active) {
      flutterInteractive = !!active;
      applyFlutterState();
    }

    // Continuously ensure Flutter's Shadow DOM stays 100% transparent
    // AND passes pointer events through to the Windy iframe when not in a modal
    function applyFlutterState() {
      var pane = document.querySelector('flt-glass-pane');
      var hz = document.getElementById('flutter-hitzones');
      if (hz) {
        hz.style.display = flutterInteractive ? 'none' : 'block';
      }
      if (pane) {
        pane.style.setProperty('background', 'transparent', 'important');
        pane.style.setProperty('background-color', 'transparent', 'important');
        var pe = flutterInteractive ? 'auto' : 'none';
        pane.style.setProperty('pointer-events', pe, 'important');
        if (pane.shadowRoot) {
          var style = pane.shadowRoot.getElementById('flutter-transparent-style');
          if (!style) {
            style = document.createElement('style');
            style.id = 'flutter-transparent-style';
            pane.shadowRoot.appendChild(style);
          }
          style.textContent = `
            :host {
              background: transparent !important;
              background-color: transparent !important;
              pointer-events: ` + pe + ` !important;
            }
            flt-scene-host, flt-scene, flt-canvas, canvas {
              background: transparent !important;
              background-color: transparent !important;
              pointer-events: ` + pe + ` !important;
            }
          `;
          var canvases = pane.shadowRoot.querySelectorAll('canvas');
          canvases.forEach(function(c) {
            c.style.setProperty('background', 'transparent', 'important');
            c.style.setProperty('background-color', 'transparent', 'important');
            c.style.setProperty('pointer-events', pe, 'important');
          });
        }
      }
    }
    setInterval(applyFlutterState, 200);

    function wireButton(id, fnName) {
      var el = document.getElementById(id);
      if (!el) return;
      var trigger = function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (typeof window[fnName] === 'function') {
          window[fnName]();
        }
      };
      el.addEventListener('click', trigger);
      el.addEventListener('touchend', trigger, { passive: false });
    }

    function initHitzones() {
      wireButton('btn-hamburger', 'flutterOpenDrawer');
      wireButton('btn-sos', 'flutterSOS');
      wireButton('btn-recenter', 'flutterRecenter');
      wireButton('btn-action', 'flutterAction');
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initHitzones);
    } else {
      initHitzones();
    }

    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Windy map as full-screen background -->
  <div id="windy-bg">
    <iframe id="windy-frame"
      src="https://embed.windy.com/embed2.html?lat=20.59&lon=78.96&detailLat=20.59&detailLon=78.96&zoom=5&level=surface&overlay=wind&product=ecmwf&menu=false&message=false&marker=false&calendar=now&pressure=false&metricWind=default&metricTemp=default&radarRange=-1&key=OjwfppPns1vyuKYfXsKSdjiURjbPzdeT">
    </iframe>
  </div>

  <!-- Transparent hit-targets positioned exactly over Flutter's buttons -->
  <div id="flutter-hitzones">
    <!-- Hamburger button top-left -->
    <div id="btn-hamburger" class="flutter-btn-target" title="Menu" style="position: absolute; top: 8px; left: 14px; width: 54px; height: 54px; border-radius: 50%;"></div>
    <!-- SOS button bottom-right -->
    <div id="btn-sos" class="flutter-btn-target" title="SOS" style="position: absolute; bottom: 156px; right: 16px; width: 64px; height: 64px; border-radius: 12px;"></div>
    <!-- Recenter button bottom-right -->
    <div id="btn-recenter" class="flutter-btn-target" title="Recenter" style="position: absolute; bottom: 86px; right: 16px; width: 64px; height: 64px; border-radius: 50%;"></div>
    <!-- Action button bottom-right -->
    <div id="btn-action" class="flutter-btn-target" title="Action" style="position: absolute; bottom: 16px; right: 16px; width: 64px; height: 64px; border-radius: 50%;"></div>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
